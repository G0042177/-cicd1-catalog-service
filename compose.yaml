services:
  catalog:
    image: cicd1-catalog-service:lab7
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/catalogdb;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    volumes:
      - catalog_data:/app/data

volumes:
  catalog_data: